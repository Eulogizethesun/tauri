[package]
name = "api"
version = "0.1.0"
description = "An example Tauri Application showcasing the api"
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0 OR MIT"

[lib]
name = "api_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { path = "../../../crates/tauri-build", features = [
  "codegen",
  "isolation",
] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tiny_http = "0.11"
log = "0.4.21"
anyhow = "1"
tauri-plugin-sample = { path = "./tauri-plugin-sample/" }
tauri-plugin-http = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-os = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-fs = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-persisted-scope = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-shell = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-clipboard-manager = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-process = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-updater = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-autostart = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-log = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-notification = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-window-state = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
sentry = { version = "0.42", default-features = false, features = ["reqwest", "rustls", "backtrace", "contexts", "panic", "debug-images"] }
tauri-plugin-sentry = { git = "https://github.com/Eulogizethesun/sentry-tauri", branch = "ohdev-git" }
chrono = "0.4"
url = "2"
# ws echo server fixture (port 3004) for plugin-websocket autotest; used under #[cfg(desktop)]
# in lib.rs. Declared unconditionally because `cfg(desktop)` is injected by tauri's build.rs
# (cargo:rustc-cfg=desktop) and is invisible to Cargo's [target.cfg] dependency resolution —
# gating under [target.'cfg(desktop)'] left it unactivated on OHOS-desktop (E0432 unresolved import).
tungstenite = "0.24"

[target.'cfg(not(target_env = "ohos"))'.dependencies]
tauri-plugin-dialog = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
# deep-link is registered for non-OHOS in lib.rs (the #[cfg(not(target_env = "ohos"))] block,
# L93-111) and the plugin ships native desktop support (windows/macos/linux targets in its
# own Cargo.toml). Declared here rather than in the unconditional [dependencies] to avoid a
# duplicate with the OHOS entry below (L58).
tauri-plugin-deep-link = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }

[target.'cfg(target_env = "ohos")'.dependencies]
napi-ohos = { version = "1.1" }
napi-derive-ohos = { version = "1.1" }
hilog = "*"
openharmony-ability = { git = "https://github.com/Eulogizethesun/openharmony-ability", branch = "ohdev-git" }
# OHOS print-job terminal-state events (print-state crossbeam channel → emit "ohos-print-state")
openharmony-ability-plugin-webview = { git = "https://github.com/Eulogizethesun/openharmony-ability", branch = "ohdev-git" }
# set_ime_position_test facade call (D3.8 direct-await version)
openharmony-ability-plugin-window = { git = "https://github.com/Eulogizethesun/openharmony-ability", branch = "ohdev-git" }
tauri-plugin-dialog = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-single-instance = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-global-shortcut = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-deep-link = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-store = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-sql = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git", features = ["sqlite"] }
tauri-plugin-websocket = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-cli = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-upload = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-localhost = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-opener = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-positioner = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
# Mobile-native plugins adapted to OHOS (mobile-form bridges; runtime invoke
# routing for plugin:NAME|command requires OHOS_DEVICE_TYPE=mobile for the
# biometric/nfc/barcode-scanner commands that have no Rust invoke_handler).
tauri-plugin-haptics = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-geolocation = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-biometric = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-nfc = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-barcode-scanner = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
tauri-plugin-huawei-account = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
# OHOS-only: minimal accessibility API (font scale / screen reader state + event)
tauri-plugin-accessibility = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
# OHOS-only: in-app webview screenshot + color picking
tauri-plugin-screenshot = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
# OHOS-only: passive app-continuation restore queries
tauri-plugin-continuation = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }
muda = { git = "https://github.com/Eulogizethesun/muda", branch = "ohdev-git" }
tray-icon = { git = "https://github.com/Eulogizethesun/tray-icon", branch = "ohdev-git" }

[dependencies.tauri]
path = "../../../crates/tauri"
features = [
  "protocol-asset",
  "image-ico",
  "image-png",
  "isolation",
  "macos-private-api",
  "tray-icon",
  "unstable",
  "webview-data-url",
]

[dev-dependencies.tauri]
path = "../../../crates/tauri"
features = ["test"]

[features]
prod = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]
# Coverage dump command (OHOS only). Enables invoke('dump_coverage') to flush
# LLVM profiling data (.profraw) to the app sandbox cache dir.
cov-dump = []
# Fault injection commands (OHOS only). Enables invoke('fault_injection_set_rule')
# and invoke('fault_injection_clear') to inject bridge call failures for coverage.
fault-injection = ["openharmony-ability/fault-injection"]

[profile.release]
# Enable debug info (most important for OHOS panic/crash debugging)
debug = true

# Optional: preserve line numbers and variable names for gdb/lldb/backtrace
strip = false
opt-level = 0  # Disable optimization for clearest debug experience
