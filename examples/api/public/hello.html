<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>

    /* 只给这个盒子设置居中样式，不影响任何其他元素 */
    .center-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
      align-items: center;

      /* 让盒子占满整个屏幕，实现全屏居中 */
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    iframe#__tauri_isolation__ {
      display: none !important;
    }

    h1 {
      color: #333;
    }

    /* multi-uiability-windows 4.3 判据取件面：点击计数 + IME 回显。
       事件只打 console（ARKWEB-CONSOLE），不改布局语义。 */
    .probe-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- 只有这里面的内容会居中 -->
  <div class="center-box">
    <h1>Hello World</h1>
    <div class="probe-row">
      <button id="probe-btn">clicked 0 times</button>
      <input id="probe-input" placeholder="IME probe" />
    </div>
  </div>

  <script>
    // 4.3 evidence (openspec multi-uiability-windows): the spawned UIAbility
    // window's own webview must consume its clicks (counter rises, main window
    // unaffected) and its IME input while it holds focus.
    (function () {
      var count = 0;
      var btn = document.getElementById('probe-btn');
      btn.addEventListener('click', function () {
        count += 1;
        btn.textContent = 'clicked ' + count + ' times';
        console.log('[spawned-page] click #' + count);
      });
      var input = document.getElementById('probe-input');
      input.addEventListener('input', function () {
        console.log('[spawned-page] ime input: ' + JSON.stringify(input.value));
      });
    })();
  </script>

</body>
</html>
