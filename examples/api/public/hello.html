<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>

    /* Centering styles apply to this box only; no other element is affected */
    .center-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
      align-items: center;

      /* Make the box fill the whole screen to center it full-screen */
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    iframe#__tauri_isolation__ {
      display: none !important;
    }

    h1 {
      color: #333;
    }

    /* multi-uiability-windows 4.3 acceptance-probe surface: click counter + IME echo.
       Events are logged to console only (ARKWEB-CONSOLE); layout semantics are unchanged. */
    .probe-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- Only the content inside here gets centered -->
  <div class="center-box">
    <h1>Hello World</h1>
    <div class="probe-row">
      <button id="probe-btn">clicked 0 times</button>
      <input id="probe-input" placeholder="IME probe" />
    </div>
  </div>

  <script>
    // 4.3 evidence (openspec multi-uiability-windows): the spawned UIAbility
    // window's own webview must consume its clicks (counter rises, main window
    // unaffected) and its IME input while it holds focus.
    (function () {
      var count = 0;
      var btn = document.getElementById('probe-btn');
      btn.addEventListener('click', function () {
        count += 1;
        btn.textContent = 'clicked ' + count + ' times';
        console.log('[spawned-page] click #' + count);
      });
      var input = document.getElementById('probe-input');
      input.addEventListener('input', function () {
        console.log('[spawned-page] ime input: ' + JSON.stringify(input.value));
      });
    })();
  </script>

</body>
</html>
