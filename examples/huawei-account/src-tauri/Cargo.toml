[package]
name = "huawei-account"
version = "0.1.0"
description = "Minimal Tauri app for Huawei Account Kit testing (OpenHarmony)"
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0 OR MIT"

[lib]
name = "huawei_account_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { path = "../../../crates/tauri-build", features = ["codegen"] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4.21"
tauri-plugin-huawei-account = { git = "https://github.com/Eulogizethesun/plugins-workspace", branch = "ohdev-git" }

[target.'cfg(target_env = "ohos")'.dependencies]
napi-ohos = { version = "1.1" }
napi-derive-ohos = { version = "1.1" }
hilog = "0.2"
# required by the `tauri::mobile_entry_point` derive (references `openharmony_ability` at crate root)
openharmony-ability = { git = "https://github.com/Eulogizethesun/openharmony-ability", branch = "ohdev-git" }

[dependencies.tauri]
path = "../../../crates/tauri"
features = ["unstable"]

[features]
prod = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[profile.release]
# Enable debug info for OHOS panic/crash debugging
debug = true
strip = false
opt-level = 0
