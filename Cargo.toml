[workspace]
members = [
  "crates/tauri",
  "crates/tauri-runtime",
  "crates/tauri-runtime-wry",
  "crates/tauri-macros",
  "crates/tauri-utils",
  "crates/tauri-build",
  "crates/tauri-codegen",
  "crates/tauri-plugin",
  "crates/tauri-schema-generator",
  "crates/tauri-schema-worker",
  "crates/tauri-cli",
  "crates/tauri-bundler",
  "crates/tauri-macos-sign",
  "crates/tauri-driver",

  # @tauri-apps/cli rust project
  "packages/cli",

  # integration tests
  "crates/tests/restart",
  "crates/tests/acl",

  # bench
  "bench",
  "bench/tests/cpu_intensive/src-tauri",
  "bench/tests/files_transfer/src-tauri",
  "bench/tests/helloworld/src-tauri",

  # examples
  "examples/file-associations/src-tauri",
  "examples/resources/src-tauri",
  "examples/api/src-tauri",
  "examples/api/src-tauri/tauri-plugin-sample",
  "examples/huawei-account/src-tauri",
]
resolver = "2"

[workspace.package]
authors = ["Tauri Programme within The Commons Conservancy"]
homepage = "https://tauri.app/"
repository = "https://github.com/tauri-apps/tauri"
categories = ["gui", "web-programming"]
license = "Apache-2.0 OR MIT"
edition = "2021"
rust-version = "1.77.2"

# default to small, optimized workspace release binaries
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true

# profiles for tauri-cli
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.release-size-optimized]
inherits = "release"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"

# Temporary patch to schemars to preserve newlines in docstrings for our reference docs schemas
# See https://github.com/GREsau/schemars/issues/120 for reference
[patch.crates-io]
schemars_derive = { git = 'https://github.com/tauri-apps/schemars.git', branch = 'feat/preserve-description-newlines' }
tauri = { path = "./crates/tauri" }
tauri-plugin = { path = "./crates/tauri-plugin" }
tauri-utils = { path = "./crates/tauri-utils" }
cargo-mobile2 = { path = "../cargo-mobile2" }
wry = { path = "../wry" }
#tao = { git = "https://github.com/richerfu/tao", branch = "feat-ohos-webview" }
tao = { path = "../tao" }
muda = { path = "../muda" }
tray-icon = { path = "../tray-icon" }
openharmony-ability = { path = "../openharmony-ability/crates/ability" }
openharmony-ability-derive = { path = "../openharmony-ability/crates/derive" }
# window-vibrancy: crates/tauri restores the upstream "0.6" requirement for
# windows/macos (non-OHOS builds resolve crates.io exactly like upstream); the
# OHOS-only "0.7" requirement is redirected here to the local fork (0.7.1,
# matching upstream repo main).
window-vibrancy = { path = "../window-vibrancy" }
# stronghold-runtime: OHOS adaptation (nix excluded from the OHOS dependency
# graph + upstream DirectAlloc misaligned-offset fix), published on the
# OpenHarmony Artifactory cargo registry under the same version (2.0.1) with
# an adapted checksum — consumed through the source replacement configured in
# .cargo/config.toml (the same mechanism plugins-workspace uses), so the
# normal version requirement resolves to the adapted build with no patch
# entry. A path patch is deliberately avoided: patch entries are validated
# during dependency resolution even when the patched crate is not in the
# graph, so a path dependency would make every resolving environment (review
# checkouts, CI, external contributors) require the fork checked out as a
# sibling. Reference source of the adaptation: ohos branch of the public
# fork https://gitcode.com/dragonswordy/stronghold.rs.
